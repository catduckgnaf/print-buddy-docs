name: Docs auto-sync

# The automated form of the manual sync in README.md ("How updates
# work"): regenerate the site copies from catduckgnaf/print-buddy/docs
# at a given ref with scripts/sync-docs.py and open a PR with the diff.
# Merging that PR is what publishes — the Deploy workflow rebuilds the
# Pages site from main, never from a sync branch.
#
# Triggers:
# - workflow_dispatch: run by hand with an explicit ref (this is the
#   remedy the print-buddy release surfaces gate points at).
# - repository_dispatch "print-buddy-release": sent by print-buddy's
#   post-release surfaces workflow when a release is published and the
#   DOCS_SYNC_TOKEN secret is configured there; client_payload.ref
#   carries the release tag.
#
# With no ref from either trigger, the latest published release tag is
# used. If a sync PR for the ref is already open, its branch is updated
# instead of opening a duplicate. If the site already matches the ref,
# the run ends as a clean no-op with no PR.
#
# This does not replace the Docs sync check or its "Docs sync needed"
# issue: the per-page wiki decisions recorded there are still required
# before a sync is considered closed out (see README.md).

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Print Buddy ref to sync docs from (tag, branch or SHA; blank = latest release tag)"
        type: string
        required: false
        default: ""
  repository_dispatch:
    types: [print-buddy-release]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: docs-auto-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      INPUT_REF: ${{ inputs.ref }}
      PAYLOAD_REF: ${{ github.event.client_payload.ref }}
    steps:
      - name: Checkout this docs repo
        uses: actions/checkout@v4

      - name: Resolve the upstream ref
        id: ref
        run: |
          set -euo pipefail
          ref="${INPUT_REF:-$PAYLOAD_REF}"
          if [ -z "$ref" ]; then
            ref="$(gh api repos/catduckgnaf/print-buddy/releases/latest --jq .tag_name)"
          fi
          [[ "$ref" =~ ^[A-Za-z0-9._/-]+$ ]] || {
            echo "Ref contains unexpected characters: $ref" >&2
            exit 1
          }
          slug="$(printf '%s' "$ref" | tr '/' '-')"
          {
            echo "ref=$ref"
            echo "branch=docs-sync/$slug"
          } >> "$GITHUB_OUTPUT"
          echo "Syncing docs from catduckgnaf/print-buddy@$ref"

      - name: Checkout upstream Print Buddy at the ref
        run: |
          set -euo pipefail
          # Outside the workspace, so the upstream tree can never leak
          # into the sync branch or the changed-file detection below.
          git clone --depth 1 https://github.com/catduckgnaf/print-buddy.git "$RUNNER_TEMP/print-buddy-upstream"
          git -C "$RUNNER_TEMP/print-buddy-upstream" fetch --depth 1 origin "${{ steps.ref.outputs.ref }}"
          git -C "$RUNNER_TEMP/print-buddy-upstream" checkout --quiet FETCH_HEAD

      - name: Apply the sync
        id: sync
        run: |
          set -euo pipefail
          git switch -C "${{ steps.ref.outputs.branch }}"
          python3 scripts/sync-docs.py --upstream "$RUNNER_TEMP/print-buddy-upstream" | tee "$RUNNER_TEMP/sync-report.txt"
          {
            echo "## Docs auto-sync — print-buddy@${{ steps.ref.outputs.ref }}"
            echo ""
            echo '```'
            cat "$RUNNER_TEMP/sync-report.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No drift at this ref — clean no-op, no PR opened." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify the sync (drift check + site build)
        if: steps.sync.outputs.changed == 'true'
        run: |
          set -euo pipefail
          PRINT_BUDDY_DIR="$RUNNER_TEMP/print-buddy-upstream" scripts/check-sync.sh
          npm ci
          npm run docs:build

      - name: Commit, push and open or update the sync PR
        if: steps.sync.outputs.changed == 'true'
        run: |
          set -euo pipefail
          ref="${{ steps.ref.outputs.ref }}"
          branch="${{ steps.ref.outputs.branch }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync docs from print-buddy $ref (auto-sync)"
          git push --force-with-lease origin "$branch"
          {
            echo "Automated docs sync from [catduckgnaf/print-buddy@$ref](https://github.com/catduckgnaf/print-buddy/tree/$ref) — the source of truth — produced by \`scripts/sync-docs.py\` (workflow: Docs auto-sync)."
            echo ""
            echo '```'
            cat "$RUNNER_TEMP/sync-report.txt"
            echo '```'
            echo ""
            echo "Verified before opening: \`scripts/check-sync.sh\` reports NO DRIFT against that ref and \`npm run docs:build\` passes."
            echo ""
            echo "Notes for the reviewer:"
            echo "- Merging this PR publishes: the Deploy workflow rebuilds the GitHub Pages site from \`main\`."
            echo "- New guides (ADDED lines) got a sidebar entry in the Guide section with a title taken from the guide's first heading — both are defaults; move or rename them here if another section fits better."
            echo "- The per-page **wiki decisions** are still required before this sync counts as closed out: they are recorded on the 'Docs sync needed' issue (see README.md, \"The wiki decision\"). This PR does not replace them."
          } > pr-body.md
          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh pr comment "$existing" --repo "$GITHUB_REPOSITORY" \
              --body "Updated by a re-run of the Docs auto-sync for print-buddy@$ref (run $GITHUB_RUN_ID): the branch now carries the latest sync for that ref."
            echo "Updated existing sync PR #$existing."
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --head "$branch" \
              --title "Docs sync: print-buddy@$ref" --body-file pr-body.md
          fi
